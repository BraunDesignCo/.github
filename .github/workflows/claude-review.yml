# RETIRED 2026-08-31.
# Claude second-opinion PR review was removed org-wide after an audit:
# it did not catch bugs Bugbot missed, and it defaulted to needs-changes
# on nits. Do not re-add callers. Bugbot itself was turned off on
# 2026-09-29; each repo's claude-code-review.yml is the PR reviewer now.
#
# This stub keeps workflow_call so leftover thin callers do not fail CI
# or spend ANTHROPIC_API_KEY credits. Delete leftover
# .github/workflows/claude-review.yml files in each repo.

name: Claude second-opinion review (retired)

on:
  workflow_call:
    inputs:
      context:
        description: Unused. Kept so leftover callers do not fail.
        type: string
        required: false
        default: ""
      model:
        description: Unused. Kept so leftover callers do not fail.
        type: string
        required: false
        default: claude-sonnet-4-6
      max_diff_bytes:
        description: Unused. Kept so leftover callers do not fail.
        type: number
        required: false
        default: 180000

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "Claude second-opinion review was retired on 2026-08-31." >> "$GITHUB_STEP_SUMMARY"
          echo "No Anthropic API call is made. Delete the caller workflow in this repo."
