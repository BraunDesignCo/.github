# Retired 2026-08-31. Grok second-opinion reviews are off org-wide.
# Callers can stay until deleted; this reusable job never runs.
# Use Cursor Bugbot for PR review.

name: Grok second-opinion review (reusable)

on:
  workflow_call:
    inputs:
      context:
        description: Unused (workflow retired)
        type: string
        required: false
        default: ""
      model:
        description: Unused (workflow retired)
        type: string
        required: false
        default: grok-4.3
      max_diff_bytes:
        description: Unused (workflow retired)
        type: number
        required: false
        default: 180000

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Grok second-opinion review is retired. Use Bugbot."
